<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="吉他課紀錄">
<meta name="theme-color" content="#8b5e3c">
<title>吉他課紀錄</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2521;--muted:#8a8078;--line:#ece5db;--accent:#b06a3b;--soft:#f6ece2;--danger:#c0392b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom));}
.topbar{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.92);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;}
.topbar .sub{font-size:12px;color:var(--muted);white-space:nowrap;}
.page{display:none;padding:16px;}
.page.active{display:block;}
.empty{text-align:center;color:var(--muted);padding:48px 24px;font-size:14px;line-height:1.9;}
.date-head{font-size:13px;color:var(--muted);font-weight:600;margin:20px 4px 8px;letter-spacing:.5px;}
.date-head:first-child{margin-top:4px;}
.lesson{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);cursor:pointer;}
.lesson:active{background:#fcfaf7;}
.lesson-top{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.lesson-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;color:var(--accent);letter-spacing:.5px;}
.lesson-name{font-weight:600;font-size:15px;}
.lesson-body{font-size:14px;color:#4a423c;white-space:pre-wrap;word-break:break-word;}
.lesson-next{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:#4a423c;white-space:pre-wrap;word-break:break-word;}
.lesson-next .lbl{color:var(--muted);font-size:12px;}
.student{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.student:active{background:#fcfaf7;}
.student-name{font-weight:600;}
.student-right{display:flex;align-items:center;gap:4px;}
.student-count{font-size:13px;color:var(--muted);}
.icon-btn{background:none;border:none;font-size:16px;padding:6px 8px;cursor:pointer;color:var(--muted);line-height:1;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600;}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:88px;line-height:1.6;}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:inherit;font-size:16px;font-weight:600;border:none;border-radius:12px;padding:14px 20px;cursor:pointer;background:var(--accent);color:#fff;width:100%;}
.btn:active{opacity:.85;}
.btn.secondary{background:var(--soft);color:var(--accent);}
.btn.danger{background:#fdecea;color:var(--danger);}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn-row{display:flex;gap:10px;margin-top:10px;}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.tabbar button{flex:1;background:none;border:none;font-family:inherit;padding:10px 4px 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.tabbar button.active{color:var(--accent);}
.tabbar .ico{font-size:20px;line-height:1;}
.fab{position:fixed;right:16px;bottom:calc(76px + 16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;line-height:1;font-weight:300;box-shadow:0 4px 14px rgba(176,106,59,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15;padding-bottom:3px;}
.fab:active{transform:scale(.95);}
.modal{position:fixed;inset:0;z-index:50;display:none;}
.modal.open{display:block;}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);}
.modal-panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:slideUp .22s ease-out;}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-head h2{font-size:17px;margin:0;}
.close-x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px;line-height:1;}
.filter-bar{display:none;align-items:center;justify-content:space-between;background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:6px;font-size:14px;color:var(--accent);}
.filter-bar button{background:none;border:none;font-family:inherit;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer;padding:4px;}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="topTitle">吉他課紀錄</h1>
  <span class="sub" id="topSub"></span>
</div>

<section class="page active" id="page-lessons">
  <div class="filter-bar" id="filterBar"></div>
  <div id="lessonList"></div>
</section>

<section class="page" id="page-students">
  <div class="field">
    <label>新增學生</label>
    <div style="display:flex;gap:8px;">
      <input id="newStudentInput" placeholder="輸入學生姓名" autocomplete="off">
      <button class="btn" style="width:auto;padding:12px 20px;" onclick="addStudent()">新增</button>
    </div>
  </div>
  <div id="studentList"></div>
</section>

<section class="page" id="page-settings">
  <div class="field">
    <label>資料備份</label>
    <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">資料只存在這支手機的瀏覽器裡。建議定期匯出備份，換手機或清除瀏覽器資料時才不會不見。</p>
    <button class="btn secondary" onclick="exportData()">匯出備份（下載檔案）</button>
    <div class="btn-row">
      <button class="btn ghost" onclick="document.getElementById('importFile').click()">匯入備份</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
  </div>
  <div class="field" style="margin-top:28px;">
    <label>統計</label>
    <div id="stats" style="font-size:14px;color:var(--muted);line-height:2;"></div>
  </div>
</section>

<button class="fab" id="fab" onclick="openNew()">＋</button>

<nav class="tabbar">
  <button data-page="lessons" class="active" onclick="switchPage('lessons')"><span class="ico">🎸</span><span>課程</span></button>
  <button data-page="students" onclick="switchPage('students')"><span class="ico">👤</span><span>學生</span></button>
  <button data-page="settings" onclick="switchPage('settings')"><span class="ico">💾</span><span>備份</span></button>
</nav>

<div class="modal" id="lessonModal">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="modalTitle">新增課程</h2>
      <button class="close-x" onclick="closeModal()">×</button>
    </div>
    <div class="field"><label>日期</label><input type="date" id="fDate"></div>
    <div class="field"><label>時間</label><input type="time" id="fTime"></div>
    <div class="field"><label>學生</label><select id="fStudent"></select></div>
    <div class="field"><label>今天上課內容</label><textarea id="fContent" placeholder="例：複習 C 和弦轉換、練習《小星星》前奏…"></textarea></div>
    <div class="field"><label>下次上課進度</label><textarea id="fNext" placeholder="例：檢查音階練習、進入刷弦節奏…"></textarea></div>
    <button class="btn" onclick="saveLesson()">儲存</button>
    <div class="btn-row" id="editActions" style="display:none;">
      <button class="btn danger" onclick="deleteLesson()">刪除這堂課</button>
    </div>
  </div>
</div>

<script>
const KEY='guitar_teacher_db_v1';
let db=loadDB(), editingId=null, activeFilterStudentId=null;

function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return {students:[],lessons:[]};
    const d=JSON.parse(raw);
    return {students:Array.isArray(d.students)?d.students:[],lessons:Array.isArray(d.lessons)?d.lessons:[]};
  }catch(e){ return {students:[],lessons:[]}; }
}
function saveDB(){
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ alert('儲存失敗，可能是瀏覽器空間不足或隱私模式限制。\n建議先到「備份」頁匯出資料。'); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTimeStr(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDateHeading(ds){
  const p=ds.split('-').map(Number);
  if(p.length!==3||p.some(isNaN)) return ds;
  const dt=new Date(p[0],p[1]-1,p[2]);
  const w=['日','一','二','三','四','五','六'][dt.getDay()];
  if(ds===todayStr()) return '今天 · '+p[1]+'月'+p[2]+'日（週'+w+'）';
  return p[0]+' 年 '+p[1]+' 月 '+p[2]+' 日（週'+w+'）';
}

function renderAll(){ renderLessons(); renderStudents(); renderStats(); renderTopSub(); renderFilterBar(); }

function renderTopSub(){
  const el=document.getElementById('topSub');
  if(!document.getElementById('page-lessons').classList.contains('active')){ el.textContent=''; return; }
  if(activeFilterStudentId){
    const s=db.students.find(x=>x.id===activeFilterStudentId);
    el.textContent=s?s.name+' 的課':'';
  }else{
    const n=db.lessons.filter(l=>l.date===todayStr()).length;
    el.textContent=n?'今天 '+n+' 堂':'';
  }
}

function renderFilterBar(){
  const bar=document.getElementById('filterBar');
  if(activeFilterStudentId){
    const s=db.students.find(x=>x.id===activeFilterStudentId);
    bar.style.display='flex';
    bar.innerHTML='<span>顯示：<b>'+esc(s?s.name:'')+'</b> 的課程</span><button onclick="clearFilter()">顯示全部</button>';
  }else{ bar.style.display='none'; bar.innerHTML=''; }
}

function renderLessons(){
  const box=document.getElementById('lessonList');
  let list=db.lessons.slice();
  if(activeFilterStudentId) list=list.filter(l=>l.studentId===activeFilterStudentId);
  if(list.length===0){
    box.innerHTML='<div class="empty">'+(activeFilterStudentId?'這位學生還沒有課程紀錄':'還沒有課程紀錄<br>點右下角「＋」新增第一堂課')+'</div>';
    return;
  }
  list.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?1:-1;
    if((a.time||'')!==(b.time||'')) return (a.time||'')<(b.time||'')?1:-1;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  let html='', cur=null;
  for(const l of list){
    if(l.date!==cur){ cur=l.date; html+='<div class="date-head">'+fmtDateHeading(l.date)+'</div>'; }
    html+='<div class="lesson" onclick="openEdit(\''+l.id+'\')">'
      +'<div class="lesson-top"><span class="lesson-time">'+esc(l.time||'')+'</span>'
      +'<span class="lesson-name">'+esc(l.studentName||'（未指定學生）')+'</span></div>'
      +(l.content?'<div class="lesson-body">'+esc(l.content)+'</div>':'')
      +(l.nextPlan?'<div class="lesson-next"><span class="lbl">下次進度：</span>'+esc(l.nextPlan)+'</div>':'')
      +'</div>';
  }
  box.innerHTML=html;
}

function renderStudents(){
  const box=document.getElementById('studentList');
  if(db.students.length===0){
    box.innerHTML='<div class="empty">還沒有學生<br>在上面輸入名字建立名單</div>';
    return;
  }
  const arr=db.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
  let html='';
  for(const s of arr){
    const n=db.lessons.filter(l=>l.studentId===s.id).length;
    html+='<div class="student" onclick="filterByStudent(\''+s.id+'\')">'
      +'<span class="student-name">'+esc(s.name)+'</span>'
      +'<div class="student-right"><span class="student-count">'+n+' 堂 ›</span>'
      +'<button class="icon-btn" onclick="event.stopPropagation();deleteStudent(\''+s.id+'\')">🗑</button></div></div>';
  }
  box.innerHTML=html;
}

function renderStats(){
  document.getElementById('stats').innerHTML='學生：'+db.students.length+' 位<br>課程紀錄：'+db.lessons.length+' 堂';
}

function switchPage(name, keepFilter){
  if(name==='lessons'&&!keepFilter) activeFilterStudentId=null;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));
  document.getElementById('topTitle').textContent=name==='lessons'?'吉他課紀錄':name==='students'?'學生名單':'資料備份';
  document.getElementById('fab').style.display=name==='lessons'?'flex':'none';
  renderTopSub(); renderFilterBar();
  window.scrollTo(0,0);
}

function filterByStudent(id){
  activeFilterStudentId=(activeFilterStudentId===id)?null:id;
  switchPage('lessons',true);
}
function clearFilter(){ activeFilterStudentId=null; switchPage('lessons',true); }

function addStudent(){
  const inp=document.getElementById('newStudentInput');
  const name=inp.value.trim();
  if(!name){ inp.focus(); return; }
  if(db.students.some(s=>s.name===name)){
    if(!confirm('已經有「'+name+'」了，要再新增一個同名的嗎？')) return;
  }
  db.students.push({id:uid(),name,createdAt:Date.now()});
  inp.value=''; inp.blur();
  saveDB(); renderAll();
}

function deleteStudent(id){
  const s=db.students.find(x=>x.id===id);
  if(!s) return;
  const n=db.lessons.filter(l=>l.studentId===id).length;
  const msg=n>0
    ? '刪除「'+s.name+'」？\n\n他有 '+n+' 堂課的紀錄。\n刪除學生不會刪掉歷史課程，課程上仍會顯示名字。'
    : '刪除「'+s.name+'」？';
  if(!confirm(msg)) return;
  db.students=db.students.filter(x=>x.id!==id);
  if(activeFilterStudentId===id) activeFilterStudentId=null;
  saveDB(); renderAll();
}

function fillStudentOptions(selId){
  const sel=document.getElementById('fStudent');
  sel.innerHTML=db.students.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'))
    .map(s=>'<option value="'+s.id+'"'+(s.id===selId?' selected':'')+'>'+esc(s.name)+'</option>').join('');
}

function openNew(){
  if(db.students.length===0){
    if(confirm('還沒有學生名單。\n要先到「學生」頁建立學生嗎？')) switchPage('students');
    return;
  }
  editingId=null;
  document.getElementById('modalTitle').textContent='新增課程';
  document.getElementById('editActions').style.display='none';
  document.getElementById('fDate').value=todayStr();
  document.getElementById('fTime').value=nowTimeStr();
  fillStudentOptions(null);
  document.getElementById('fContent').value='';
  document.getElementById('fNext').value='';
  document.getElementById('lessonModal').classList.add('open');
}

function openEdit(id){
  const l=db.lessons.find(x=>x.id===id);
  if(!l) return;
  editingId=id;
  document.getElementById('modalTitle').textContent='編輯課程';
  document.getElementById('editActions').style.display='flex';
  document.getElementById('fDate').value=l.date;
  document.getElementById('fTime').value=l.time||'';
  fillStudentOptions(l.studentId);
  if(l.studentId&&!db.students.find(s=>s.id===l.studentId)){
    const opt=document.createElement('option');
    opt.value=l.studentId;
    opt.textContent=(l.studentName||'（已刪除的學生）')+'（已刪除）';
    opt.selected=true;
    document.getElementById('fStudent').appendChild(opt);
  }
  document.getElementById('fContent').value=l.content||'';
  document.getElementById('fNext').value=l.nextPlan||'';
  document.getElementById('lessonModal').classList.add('open');
}

function saveLesson(){
  const date=document.getElementById('fDate').value;
  const time=document.getElementById('fTime').value;
  const studentId=document.getElementById('fStudent').value;
  const content=document.getElementById('fContent').value.trim();
  const nextPlan=document.getElementById('fNext').value.trim();
  if(!date){ alert('請選擇日期'); return; }
  if(!studentId){ alert('請選擇學生'); return; }
  if(!content&&!nextPlan){ alert('請至少填寫上課內容或下次進度'); return; }
  const stu=db.students.find(s=>s.id===studentId);
  const studentName=stu?stu.name:'';
  if(editingId){
    const l=db.lessons.find(x=>x.id===editingId);
    if(l) Object.assign(l,{date,time,studentId,studentName,content,nextPlan});
  }else{
    db.lessons.push({id:uid(),date,time,studentId,studentName,content,nextPlan,createdAt:Date.now()});
  }
  saveDB(); closeModal(); renderAll();
}

function deleteLesson(){
  if(!editingId) return;
  if(!confirm('確定刪除這堂課的紀錄？')) return;
  db.lessons=db.lessons.filter(l=>l.id!==editingId);
  saveDB(); closeModal(); renderAll();
}

function closeModal(){
  document.getElementById('lessonModal').classList.remove('open');
  editingId=null;
}

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const d=new Date();
  const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const a=document.createElement('a');
  a.href=url; a.download='吉他課紀錄備份-'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importData(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d||!Array.isArray(d.students)||!Array.isArray(d.lessons)) throw new Error('檔案格式不正確');
      if(!confirm('匯入後會覆蓋目前資料。\n備份內容：'+d.students.length+' 位學生、'+d.lessons.length+' 堂課\n\n確定匯入？')){ e.target.value=''; return; }
      db={students:d.students,lessons:d.lessons};
      saveDB(); activeFilterStudentId=null; renderAll();
      alert('匯入完成');
    }catch(err){ alert('匯入失敗：'+err.message); }
    e.target.value='';
  };
  reader.readAsText(file);
}

renderAll();
</script>
</body>
</html>
